<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wide Tim Editor</title>
    <link rel="icon" href="/public/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600&display=swap"
    />
    <style>
      /* Same tokens as src/styles/global.css, so the editor looks like the site. */
      :root {
        --bg: #0d0d0d;
        --bg-elev: #1a1a1a;
        --bg-hover: #222;
        --bg-input: #111;
        --fg: #f4efe6;
        --fg-body: #d4cec6;
        --fg-muted: #a8a29a;
        --border: #2a2a2a;
        --danger: #f08066;

        --fill-coral: #f08066;
        --fill-teal: #4dbeb0;
        --fill-mustard: #e8b441;
        --fill-lavender: #a896d8;
        --fill-sky: #5fb3e0;
        --fill-pink: #ec84a3;
        --ink-coral: #f08066;
        --ink-teal: #4dbeb0;
        --ink-mustard: #e8b441;
        --ink-lavender: #a896d8;
        --ink-sky: #5fb3e0;
        --ink-pink: #ec84a3;

        --font-body: "Open Sans", system-ui, -apple-system, sans-serif;
        --font-display: "Oswald", "Open Sans", system-ui, sans-serif;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf7f0;
          --bg-elev: #faf7f0;
          --bg-hover: #f0ebe0;
          --bg-input: #faf7f0;
          --fg: #1a1a1a;
          --fg-body: #1a1a1a;
          --fg-muted: #6b665f;
          --border: #e2ddd2;
          --danger: #cd3714;
          --ink-coral: #cd3714;
          --ink-teal: #2c796f;
          --ink-mustard: #8e6711;
          --ink-lavender: #7a5ec3;
          --ink-sky: #2076a5;
          --ink-pink: #d52156;
          color-scheme: light;
        }
      }
      [data-accent="coral"] { --fill: var(--fill-coral); --ink: var(--ink-coral); }
      [data-accent="teal"] { --fill: var(--fill-teal); --ink: var(--ink-teal); }
      [data-accent="mustard"] { --fill: var(--fill-mustard); --ink: var(--ink-mustard); }
      [data-accent="lavender"] { --fill: var(--fill-lavender); --ink: var(--ink-lavender); }
      [data-accent="sky"] { --fill: var(--fill-sky); --ink: var(--ink-sky); }
      [data-accent="pink"] { --fill: var(--fill-pink); --ink: var(--ink-pink); }

      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--fg-body);
        font: 16px/1.55 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      [hidden] { display: none !important; }
      .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px 64px; }
      h1, h2, h3 { font-family: var(--font-display); color: var(--fg); font-weight: 600; margin: 0; }
      a { color: inherit; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--fill, var(--fg)); outline-offset: 2px; }
      code { font-size: 0.9em; }

      /* ---------- Header ---------- */
      .top {
        display: flex; flex-wrap: wrap; gap: 12px 24px;
        align-items: center; justify-content: space-between;
        padding: 28px 0 20px; border-bottom: 1px solid var(--border);
      }
      .top h1 { font-size: 2rem; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1.1; }
      .top p { margin: 4px 0 0; color: var(--fg-muted); font-size: 0.93rem; }
      .top-actions { display: flex; gap: 16px; align-items: center; }
      .site-link { color: var(--fg-muted); font-size: 0.93rem; white-space: nowrap; }
      .site-link:hover { color: var(--fg); }
      .publish-btn {
        display: inline-flex; gap: 8px; align-items: center;
        background: var(--fg); color: var(--bg); border: 2px solid var(--fg); border-radius: 999px;
        padding: 7px 18px; font-family: var(--font-display); font-weight: 500; letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .publish-btn:disabled { background: transparent; color: var(--fg-muted); border-color: var(--border); cursor: default; }
      .badge {
        background: var(--fill-coral); color: #1a1a1a; border-radius: 999px; min-width: 1.5em;
        padding: 0 6px; font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; text-align: center;
      }

      /* ---------- Layout & sidebar ---------- */
      .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 40px; padding-top: 24px; }
      .sidebar { position: sticky; top: 16px; align-self: start; display: grid; gap: 20px; }
      .nav-heading {
        font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em;
        font-size: 0.8rem; color: var(--ink); margin: 0 0 6px 10px;
      }
      .nav-items { display: grid; gap: 2px; }
      .nav-item {
        display: flex; justify-content: space-between; gap: 8px; align-items: center; text-align: left;
        background: none; border: none; border-radius: 8px; padding: 6px 10px; color: var(--fg); font-size: 0.95rem;
        border-left: 3px solid transparent;
      }
      .nav-item:hover { background: var(--bg-hover); }
      .nav-item[aria-current="page"] { background: var(--bg-hover); border-left-color: var(--fill); font-weight: 600; }
      .nav-item .count { color: var(--fg-muted); font-size: 0.8rem; font-weight: 400; }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; gap: 16px; }
        .sidebar { position: static; gap: 10px; }
        .nav-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .nav-heading { margin: 0 4px 0 0; width: 100%; }
        .nav-items { display: flex; flex-wrap: wrap; gap: 6px; }
        .nav-item { border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
        .nav-item[aria-current="page"] { border-color: var(--fill); background: var(--fill); color: #1a1a1a; }
        .nav-item[aria-current="page"] .count { color: #1a1a1a; }
      }

      /* ---------- Panel ---------- */
      .panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
      .panel-head h2 { font-size: 1.7rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); }
      .page-link { font-size: 0.93rem; color: var(--fg-muted); white-space: nowrap; }
      .page-link:hover { color: var(--fg); }
      .section-intro { margin: 6px 0 2px; }
      .page-text {
        display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
        border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 4px 0 4px;
      }
      .page-text-body { min-width: 0; font-size: 0.93rem; }
      .page-text .btn { white-space: nowrap; }
      .page-text-body > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .page-text-label {
        display: block; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em;
        font-size: 0.8rem; color: var(--ink);
      }
      .file-note { color: var(--fg-muted); font-size: 0.83rem; margin: 2px 0 12px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 0; }
      .toolbar .search { flex: 1 1 220px; }

      .btn {
        border: 2px solid var(--border); background: transparent; border-radius: 8px;
        padding: 7px 14px; font-weight: 600; font-size: 0.93rem; color: var(--fg);
      }
      .btn:hover:not(:disabled) { background: var(--bg-hover); }
      .btn-primary { background: var(--fill); border-color: var(--fill); color: #1a1a1a; }
      .btn-primary:hover:not(:disabled) { background: var(--fill); filter: brightness(1.08); }
      .btn-danger { border-color: var(--danger); color: var(--danger); }
      .btn-small { padding: 3px 10px; font-size: 0.85rem; border-width: 1px; }
      .btn:disabled { opacity: 0.45; cursor: default; }
      .icon-btn {
        width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
        background: none; color: var(--fg-muted); line-height: 1; padding: 0; flex: none;
      }
      .icon-btn:hover:not(:disabled) { color: var(--fg); background: var(--bg-hover); }
      .icon-btn:disabled { opacity: 0.3; cursor: default; }

      input[type="text"], input[type="search"], select, textarea {
        width: 100%; background: var(--bg-input); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 10px; color: var(--fg);
      }
      textarea { min-height: 5.5em; resize: vertical; }
      input:focus, select:focus, textarea:focus { outline: none; border-color: var(--fill); box-shadow: 0 0 0 1px var(--fill); }
      [aria-invalid="true"] { border-color: var(--danger) !important; }

      /* ---------- Forms ---------- */
      .form {
        border: 2px solid var(--fill); border-radius: 12px; background: var(--bg-elev);
        padding: 20px; margin: 12px 0 24px; scroll-margin-top: 16px;
      }
      .form-page { border: none; padding: 0; background: none; margin-top: 8px; }
      .form-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
      .form-title { font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); }
      .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 16px; }
      .field { grid-column: span 6; min-width: 0; }
      .span-3 { grid-column: span 3; }
      .span-2 { grid-column: span 2; }
      @media (max-width: 640px) { .span-3 { grid-column: span 6; } }
      .field > label, .field > .label { display: block; font-weight: 600; color: var(--fg); font-size: 0.9rem; margin-bottom: 4px; }
      .req { color: var(--ink); }
      .hint { color: var(--fg-muted); font-size: 0.83rem; margin-top: 4px; }
      .error { color: var(--danger); font-size: 0.83rem; margin-top: 4px; font-weight: 600; }
      .assist { font-size: 0.83rem; margin-top: 4px; color: var(--ink); }
      .assist button { background: none; border: none; padding: 0; text-decoration: underline; color: inherit; font-weight: 600; }
      .form-heading {
        grid-column: span 6; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.04em;
        color: var(--ink); border-top: 1px solid var(--border); padding-top: 18px; margin-top: 10px;
      }
      .form-heading:first-child { border-top: none; padding-top: 0; margin-top: 0; }
      .form-note {
        grid-column: span 6; margin: 0; font-size: 0.9rem; border-left: 3px solid var(--fill);
        padding: 4px 0 4px 12px; color: var(--fg-body);
      }
      .token {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em;
        background: var(--bg-hover); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
      }
      .field > .check { display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: 0.93rem; color: var(--fg); margin: 0; padding: 8px 0; }
      .field:has(> .check) { align-self: end; }
      .check input { width: 18px; height: 18px; accent-color: var(--fill); margin: 0; }
      .select-row { display: flex; gap: 8px; align-items: center; }
      .swatch { width: 26px; height: 26px; border-radius: 6px; flex: none; border: 1px solid var(--border); }

      .photo { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .photo-preview {
        width: 168px; aspect-ratio: 3 / 2; border-radius: 8px; border: 1px dashed var(--border);
        display: grid; place-items: center; color: var(--fg-muted); font-size: 0.85rem; overflow: hidden; flex: none;
      }
      .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .photo-side { flex: 1 1 220px; display: grid; gap: 8px; min-width: 0; }
      .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

      .items { display: grid; gap: 10px; }
      .item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
      .item-head { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
      .item-title { flex: 1; min-width: 0; font-weight: 600; color: var(--fg); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .string-item { display: flex; gap: 8px; align-items: flex-start; }
      .string-item > :first-child { flex: 1; min-width: 0; }
      .string-tools { display: flex; flex-direction: column; gap: 4px; }

      .html-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
      .link-tool { display: flex; flex: 1 1 260px; gap: 6px; }
      .html-preview {
        margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--bg-hover);
        font-size: 0.93rem; color: var(--fg-body);
      }
      .html-preview::before {
        content: "Preview"; display: block; font-size: 0.72rem; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--fg-muted); margin-bottom: 2px;
      }
      .html-preview a { color: var(--ink); }

      .form-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 20px; }
      .confirm { display: inline-flex; gap: 8px; align-items: center; color: var(--danger); font-weight: 600; font-size: 0.93rem; }
      .save-bar {
        margin-top: 24px; padding: 12px 0;
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        background: var(--bg); border-top: 1px solid var(--border);
      }
      /* Pinned to the bottom of the window only while there's something to save. */
      .save-bar.dirty { position: sticky; bottom: 0; z-index: 2; }
      .save-bar .status { color: var(--fg-muted); font-size: 0.9rem; margin-right: auto; }
      .save-bar .status.dirty { color: var(--ink); font-weight: 600; }

      /* ---------- Lists ---------- */
      .year { font-size: 1.15rem; color: var(--ink); margin: 20px 0 6px; letter-spacing: 0.02em; }
      .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
      .list li { border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
      .row {
        flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; text-align: left;
        background: none; border: none; padding: 10px 8px; border-radius: 6px;
      }
      .row:hover { background: var(--bg-hover); }
      .row.active { background: var(--bg-hover); box-shadow: inset 3px 0 0 var(--fill); }
      .row .when { flex: 0 0 6.2em; color: var(--fg-muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
      .row .what { min-width: 0; }
      .row .name { color: var(--fg); font-weight: 600; }
      .row .inline::before { content: " — "; }
      .row .inline { color: var(--fg-muted); }
      .row .below { display: block; color: var(--fg-muted); font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .thumb {
        flex: 0 0 72px; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border);
        display: grid; place-items: center; font-size: 0.7rem; color: var(--fg-muted);
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .move { display: flex; gap: 4px; padding-right: 4px; }
      .empty { color: var(--fg-muted); padding: 24px 0; }

      /* ---------- Publish dialog ---------- */
      dialog {
        width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto;
        background: var(--bg-elev); color: var(--fg-body); border: 1px solid var(--border);
        border-radius: 14px; padding: 24px;
      }
      dialog::backdrop { background: rgb(0 0 0 / 0.55); }
      dialog h2 { font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 12px; }
      .changes { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 12px; }
      .changes h3 { font-family: var(--font-body); font-size: 0.9rem; color: var(--fg); margin-bottom: 2px; }
      .changes ul { margin: 0; padding-left: 18px; }
      .changes .verb { color: var(--fg-muted); }
      .dialog-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
      .dialog-status { font-weight: 600; color: var(--fg); }
      .dialog-status.bad { color: var(--danger); }
      .muted { color: var(--fg-muted); font-size: 0.9rem; }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 10;
        max-width: min(560px, calc(100vw - 32px)); width: max-content;
        background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px;
        display: flex; gap: 14px; align-items: center; font-size: 0.93rem;
        opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.25);
      }
      .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
      .toast.bad { background: var(--danger); color: #fff; }
      .toast button, .toast a { background: none; border: none; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; white-space: nowrap; }

      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <h1>Wide Tim Editor</h1>
          <p>Edit the site's content here. Saved changes show up in the site preview right away; Publish puts them on widetim.com.</p>
        </div>
        <div class="top-actions">
          <a class="site-link" id="site-link" target="_blank" rel="noopener">Site preview ↗</a>
          <button class="publish-btn" id="publish-btn" type="button" disabled>Publish</button>
        </div>
      </header>
      <div class="layout">
        <nav class="sidebar" id="nav" aria-label="What to edit"></nav>
        <main id="panel"><p class="empty">Loading…</p></main>
      </div>
    </div>
    <dialog id="publish-dialog" aria-labelledby="publish-title"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module">
      // ---------- Small helpers ----------

      // h("div", { class: "x", onclick: fn }, child, ...) → element.
      function h(tag, props = {}, ...children) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (v == null || v === false) continue;
          if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
          else if (k === "class") el.className = v;
          else if (k === "value" || k === "checked" || k === "selected") el[k] = v;
          else el.setAttribute(k, v === true ? "" : v);
        }
        for (const c of children.flat(Infinity)) {
          if (c == null || c === false) continue;
          el.append(c instanceof Node ? c : String(c));
        }
        return el;
      }
      const $ = (s) => document.querySelector(s);
      // replaceChildren that skips false/null/undefined, like h() does.
      const fill = (el, ...children) => el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));

      // Reads/writes a value by path, e.g. ["quickLinks", 2, "href"].
      const get = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
      function set(obj, path, value) {
        const parent = get(obj, path.slice(0, -1));
        const key = path.at(-1);
        if (value === undefined) delete parent[key];
        else parent[key] = value;
      }
      const pathOf = (base, key) => [...base, ...String(key).split(".")];
      const idOf = (path) => "f-" + path.join("-");

      const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const SHORT = MONTHS.map((m) => m.slice(0, 3));

      // Same rules as parseMonth in src/content/collaborators.ts: "1"-"12" or a month name.
      function parseMonth(s) {
        const v = String(s ?? "").trim().toLowerCase();
        if (!v) return 0;
        const n = parseInt(v, 10);
        if (n >= 1 && n <= 12) return n;
        return MONTHS.findIndex((m) => v.startsWith(m.slice(0, 3).toLowerCase())) + 1;
      }

      const collabKey = (r) => (parseInt(r.year, 10) || 0) * 10000 + parseMonth(r.month) * 100 + (parseInt(r.day, 10) || 0);
      const matches = (q, ...values) => !q || values.some((v) => String(v ?? "").toLowerCase().includes(q));
      const plural = (n, one, many = one + "s") => `${n} ${n === 1 ? one : many}`;
      const isEmpty = (v) => v == null || v === "" || (Array.isArray(v) && v.length === 0);

      // How the editor shows a photo that a data file refers to.
      function photoSrc(value, folder) {
        if (!value) return "";
        if (/^https?:\/\//.test(value)) return value;
        if (folder === "carousel") return "/carousel/" + value;
        return "/public" + (value.startsWith("/") ? value : "/" + value);
      }

      const URL_OK = /^(https?:\/\/|\/|mailto:)\S+$/;
      const URL_ERROR = "Use a full link (https://…), a page on this site (/about/press) or an email (mailto:…).";
      const ACCENTS = ["coral", "teal", "mustard", "lavender", "sky", "pink"];
      const HTML_HINT = "To link some words, select them and click Add link.";

      // ---------- What can be edited ----------
      // One section per page of the site, grouped and ordered like the site's
      // own menu (and colored like it). Each section is one data file:
      // "list" sections hold entries edited one at a time, and may also have
      // `pageText` (the page's heading and intro, in a file of their own);
      // "page" sections are one form. `fields` drive the forms: `key` may be a
      // dotted path, `span` is out of 6 columns, and entries with `heading` or
      // `note` just add text to the form.

      const SECTIONS = {
        home: {
          kind: "page", group: "Home", label: "Greeting & link bars", accent: "lavender", page: "/",
          intro: "The greeting and link bars on the home page.",
          fields: [
            { key: "heading", label: "Greeting", required: true },
            { key: "intro", label: "Intro", type: "textarea", hint: "Optional paragraph under the greeting." },
            { key: "quickLinks", label: "Link bars", type: "list", itemNoun: "link bar", itemLabel: (l) => l.label,

          intro: "The name and description used across the whole site.",
          fields: [

          ],
        },
      };
      const GROUPS = ["Home", "About", "For Fun", "Contact", "Every page"];

      // ---------- State ----------

      function storageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
      function storageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

      const state = {
        data: null, // { site, <section>: { data, version, file } }
        tab: SECTIONS[storageGet("editor-tab")] ? storageGet("editor-tab") : "collaborations",
        query: "",
        // The open form: { index (list entry; -1 = new; null for a page),
        // draft, original, errors, bust, confirmDelete }
        form: null,
        publish: null, // { changes, pending, problem }
      };
      const panel = $("#panel");

      // ---------- Server calls ----------

      async function api(method, url, body) {
        let res;
        try {
          // Writes always go as JSON (the server only accepts JSON for them).
          const write = method !== "GET";
          res = await fetch(url, {
            method,
            headers: write ? { "Content-Type": "application/json" } : {},
            body: write ? JSON.stringify(body ?? {}) : undefined,
          });
        } catch {
          throw new Error("Can't reach the editor. Is its Terminal window still open?");
        }
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw Object.assign(new Error(json.error ?? `Error ${res.status}`), { status: res.status });
        return json;
      }

      async function loadData() {
        state.data = await api("GET", "/api/data");
        $("#site-link").href = state.data.preview;
      }

      // Saves a whole data file. On success, offers to undo by saving the old version back.
      async function saveData(name, data, message, { undoable = true } = {}) {
        const ds = state.data[name];
        const before = ds.data;
        try {
          const { version } = await api("PUT", `/api/data/${name}`, { data, version: ds.version });
          ds.data = data;
          ds.version = version;
          toast(message, {
            undo: undoable ? () => saveData(name, before, "Undone.", { undoable: false }).then(() => { state.form = null; render(); }) : null,
            view: state.data.preview + SECTIONS[state.tab].page,
          });
          refreshPublish();
          return true;
        } catch (err) {
          toast(err.message, { bad: true });
          if (err.status === 409) {
            await loadData();
            state.form = null;
            render();
          }
          return false;
        }
      }

      // ---------- Toast ----------

      let toastTimer;
      function toast(message, { bad = false, undo = null, view = null } = {}) {
        const el = $("#toast");
        fill(el,
          h("span", {}, message),
          undo && h("button", { onclick: () => { el.classList.remove("show"); undo(); } }, "Undo"),
          view && h("a", { href: view, target: "_blank", rel: "noopener" }, "View on site ↗"),
        );
        el.className = `toast show${bad ? " bad" : ""}`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), bad ? 9000 : 7000);
      }

      // ---------- Layout ----------

      function render() {
        const sec = SECTIONS[state.tab];
        const ds = state.data[state.tab];
        panel.dataset.accent = sec.accent;
        renderNav();
        if (sec.kind === "page" && !state.form) openPage();
        fill(panel, 
          h("div", { class: "panel-head" },
            h("h2", {}, sec.label),
            h("a", { class: "page-link", href: state.data.preview + sec.page, target: "_blank", rel: "noopener" }, "View page ↗")),
          sec.intro && h("p", { class: "section-intro" }, sec.intro),
          h("p", { class: "file-note" }, "Saves to ", h("code", {}, ds.file),
            sec.pageText && [" and ", h("code", {}, state.data[sec.pageText.data].file)]),
          sec.pageText && pageTextCard(sec),
          sec.kind === "list" && h("div", { class: "toolbar" },
            h("button", { class: "btn btn-primary", onclick: () => openEntry(-1) }, `+ New ${sec.noun}`),
            h("input", {
              type: "search", class: "search", placeholder: `Search ${sec.label.toLowerCase()}…`,
              "aria-label": `Search ${sec.label.toLowerCase()}`, value: state.query,
              oninput: (e) => { state.query = e.target.value; renderList(); },
            })),
          h("div", { id: "form-host" }),
          sec.kind === "list" && h("div", { id: "list-host" }),
        );
        renderForm();
        if (sec.kind === "list") renderList();
      }

      function renderNav() {
        fill($("#nav"), ...GROUPS.map((group) =>
          h("div", { class: "nav-group", "data-accent": Object.values(SECTIONS).find((s) => s.group === group).accent },
            h("div", { class: "nav-heading" }, group),
            h("div", { class: "nav-items" }, Object.entries(SECTIONS).filter(([, s]) => s.group === group).map(([key, s]) =>
              h("button", {
                class: "nav-item", "data-accent": s.accent, "aria-current": key === state.tab ? "page" : null,
                onclick: () => switchTab(key),
              }, s.label, s.kind === "list" && h("span", { class: "count" }, state.data[key].data.length)))),
          )));
      }

      function switchTab(key) {
        if (key === state.tab || blockedByOpenForm()) return;
        state.tab = key;
        state.query = "";
        state.form = null;
        storageSet("editor-tab", key);
        render();
        window.scrollTo({ top: 0 });
      }

      // ---------- Lists ----------

      function renderList() {
        const sec = SECTIONS[state.tab];
        const cfg = sec.list;
        const items = state.data[state.tab].data;
        const q = state.query.trim().toLowerCase();
        let rows = items.map((r, index) => ({ r, index })).filter(({ r }) => matches(q, ...cfg.search(r)));
        if (cfg.sort) rows.sort((a, b) => cfg.sort(a.r, b.r));
        const host = $("#list-host");
        if (!rows.length) {
          return fill(host, h("p", { class: "empty" }, q ? "Nothing matches that search." : `No ${sec.label.toLowerCase()} yet.`));
        }

        const row = ({ r, index }) => h("li", {},
          h("button", { class: `row${state.form?.index === index ? " active" : ""}`, onclick: () => openEntry(index) },
            cfg.when && h("span", { class: "when" }, cfg.when(r)),
            cfg.thumb && h("span", { class: "thumb" }, cfg.thumb(r) ? h("img", { src: cfg.thumb(r), alt: "", loading: "lazy" }) : "No photo"),
            h("span", { class: "what" },
              h("span", { class: "name" }, cfg.title(r) || "(untitled)"),
              cfg.inline?.(r) && h("span", { class: "inline" }, cfg.inline(r)),
              cfg.below?.(r) && h("span", { class: "below" }, cfg.below(r)))),
          cfg.reorder && !q && h("span", { class: "move" },
            h("button", { class: "icon-btn", "aria-label": `Move ${cfg.title(r)} up`, title: "Move up", disabled: index === 0, onclick: () => moveEntry(index, -1) }, "↑"),
            h("button", { class: "icon-btn", "aria-label": `Move ${cfg.title(r)} down`, title: "Move down", disabled: index === items.length - 1, onclick: () => moveEntry(index, 1) }, "↓")),
        );

        if (!cfg.groupBy) return fill(host, h("ul", { class: "list" }, rows.map(row)));
        const groups = new Map();
        for (const x of rows) {
          const g = cfg.groupBy(x.r);
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(x);
        }
        fill(host, ...[...groups].map(([g, list]) => h("section", {},
          h("h3", { class: "year" }, g, h("span", { class: "sr-only" }, `, ${plural(list.length, "entry", "entries")}`)),
          h("ul", { class: "list" }, list.map(row)))));
      }

      // The page's own heading/intro, shown above a list with an Edit button.
      function pageTextCard(sec) {
        const data = state.data[sec.pageText.data].data;
        return h("div", { class: "page-text" },
          h("div", { class: "page-text-body" },
            h("span", { class: "page-text-label" }, "Page text"),
            sec.pageText.fields.filter((f) => f.key && f.type !== "select").map((f) =>
              h("div", {}, h("span", { class: "muted" }, `${f.label}: `), String(get(data, pathOf([], f.key)) ?? "") || "—"))),
          h("button", { class: "btn btn-small", type: "button", onclick: () => openEntry("page") }, "Edit page text"));
      }

      async function moveEntry(index, delta) {
        if (blockedByOpenForm()) return;
        const sec = SECTIONS[state.tab];
        const items = [...state.data[state.tab].data];
        const [x] = items.splice(index, 1);
        items.splice(index + delta, 0, x);
        state.form = null;
        if (await saveData(state.tab, items, `Moved “${sec.list.title(x)}” ${delta < 0 ? "up" : "down"}.`)) render();
      }

      // ---------- Opening & closing forms ----------

      const isDirty = () => !!state.form && JSON.stringify(state.form.draft) !== JSON.stringify(state.form.original);

      // Keeps half-typed changes from being thrown away by a stray click.
      function blockedByOpenForm() {
        if (!isDirty()) return false;
        toast("Save or discard your changes first.");
        (SECTIONS[state.tab].kind === "page" ? $("#save-bar") : $("#form-host .form"))
          ?.scrollIntoView({ behavior: "smooth", block: "center" });
        return true;
      }

      // Lists inside a record start out as [] so their editors have something to add to.
      function withLists(fields, record) {
        for (const f of fields) if (f.key && (f.type === "list" || f.type === "strings") && !get(record, pathOf([], f.key))) set(record, pathOf([], f.key), []);
        return record;
      }

      // The fields of the open form: a list entry's, or the page text's.
      function formFields() {
        const sec = SECTIONS[state.tab];
        return state.form?.index === "page" ? sec.pageText.fields : sec.fields;
      }

      // `index` is the list entry's position, -1 for a new entry, "page" for
      // a list's page text, or null for a page section.
      function newForm(index, record) {
        const sec = SECTIONS[state.tab];
        withLists(index === "page" ? sec.pageText.fields : sec.fields, record);
        return { index, draft: structuredClone(record), original: structuredClone(record), errors: {}, bust: {}, confirmDelete: false };
      }

      function openEntry(index) {
        if (state.form?.index === index || blockedByOpenForm()) return;
        const sec = SECTIONS[state.tab];
        const record = index === "page" ? state.data[sec.pageText.data].data : index < 0 ? sec.blank() : state.data[state.tab].data[index];
        state.form = newForm(index, structuredClone(record));
        renderForm();
        renderList();
        const form = $("#form-host .form");
        form.scrollIntoView({ behavior: "smooth", block: "start" });
        form.querySelector("input, textarea, select")?.focus({ preventScroll: true });
      }

      function openPage() {
        state.form = newForm(null, structuredClone(state.data[state.tab].data));
      }

      function closeEntry() {
        state.form = null;
        renderForm();
        renderList();
      }

      // ---------- Rendering forms ----------

      function renderForm() {
        const host = $("#form-host");
        const f = state.form;
        if (!host) return;
        if (!f) return fill(host, );
        const sec = SECTIONS[state.tab];
        const isPage = sec.kind === "page";
        const isNew = f.index === -1;
        const isPageText = f.index === "page";
        const fields = formFields();

        fill(host, 
          h("form", {
            class: `form${isPage ? " form-page" : ""}`, novalidate: true,
            onsubmit: (e) => { e.preventDefault(); submit(); },
            onkeydown: (e) => { if (e.key === "Escape" && !isPage && !isDirty()) closeEntry(); },
          },
            // Delete sits up top, away from Save, so it's never hit by habit.
            !isPage && h("div", { class: "form-head" },
              h("h3", { class: "form-title" }, isPageText ? "Page text" : isNew ? `New ${sec.noun}` : `Edit ${sec.noun}`),
              !isNew && !isPageText && (f.confirmDelete
                ? h("span", { class: "confirm" }, "Delete this entry?",
                    h("button", { class: "btn btn-danger btn-small", type: "button", onclick: deleteEntry }, "Yes, delete"),
                    h("button", { class: "btn btn-small", type: "button", onclick: () => { f.confirmDelete = false; renderForm(); } }, "Keep it"))
                : h("button", { class: "btn btn-danger btn-small", type: "button", onclick: () => { f.confirmDelete = true; renderForm(); } }, "Delete"))),
            h("div", { class: "grid" }, renderFields(fields, [])),
            isPage
              ? h("div", { class: "save-bar", id: "save-bar" },
                  h("span", { class: "status", id: "save-status" }),
                  h("button", { class: "btn", type: "button", id: "discard-btn", onclick: () => { openPage(); renderForm(); } }, "Discard changes"),
                  h("button", { class: "btn btn-primary", type: "submit", id: "save-btn" }, "Save changes"))
              : h("div", { class: "form-actions" },
                  h("button", { class: "btn", type: "button", onclick: closeEntry }, "Cancel"),
                  h("button", { class: "btn btn-primary", type: "submit" }, isNew ? `Add ${sec.noun}` : "Save changes")),
          ),
        );
        updateDirtyUI();
        for (const field of fields) if (field.assist) updateAssist(field);
      }

      function updateDirtyUI() {
        const status = $("#save-status");
        if (!status) return;
        const dirty = isDirty();
        status.textContent = dirty ? "Unsaved changes" : "All changes saved";
        status.classList.toggle("dirty", dirty);
        $("#save-bar").classList.toggle("dirty", dirty);
        $("#save-btn").disabled = !dirty;
        $("#discard-btn").disabled = !dirty;
      }

      // Sets a draft value as the user types, without re-rendering the form.
      function setValue(path, value) {
        set(state.form.draft, path, value);
        delete state.form.errors[path.join(".")];
        updateDirtyUI();
      }

      function renderFields(fields, base) {
        return fields.map((field) => {
          if (field.heading) return h("h3", { class: "form-heading" }, field.heading);
          if (field.note) {
            const parts = [].concat(field.note).map((p) => (Array.isArray(p) ? h("span", { class: "token" }, p[0]) : p));
            return h("p", { class: "form-note" }, parts);
          }
          return renderField(field, pathOf(base, field.key));
        });
      }

      function renderField(field, path) {
        const f = state.form;
        const id = idOf(path);
        const error = f.errors[path.join(".")];
        const isGroup = ["photo", "list", "strings", "checkbox"].includes(field.type);
        return h("div", { class: `field${field.span ? ` span-${field.span}` : ""}` },
          field.type !== "checkbox" && h(isGroup ? "span" : "label", isGroup ? { class: "label" } : { for: id },
            field.label, field.required && h("span", { class: "req" }, " *")),
          control(field, path, id),
          field.assist && h("div", { class: "assist", id: `${id}-assist`, "aria-live": "polite" }),
          error ? h("div", { class: "error", id: `${id}-hint` }, error)
                : field.hint && h("div", { class: "hint", id: `${id}-hint` }, field.hint),
        );
      }

      // The input(s) for one field.
      function control(field, path, id) {
        const f = state.form;
        const value = get(f.draft, path) ?? "";
        const common = { id, "aria-invalid": f.errors[path.join(".")] ? "true" : null, "aria-describedby": `${id}-hint` };

        switch (field.type) {
          case "textarea":
            return h("textarea", { ...common, value, oninput: (e) => setValue(path, e.target.value) });
          case "html":
            return htmlControl(path, common);
          case "month":
            return h("select", { ...common, onchange: (e) => setValue(path, e.target.value) },
              h("option", { value: "" }, "—"),
              MONTHS.map((m, i) => h("option", { value: String(i + 1), selected: parseMonth(value) === i + 1 }, m)));
          case "select": {
            const swatch = field.swatch && h("span", { class: "swatch", style: `background: var(--fill-${value})` });
            const select = h("select", { ...common, onchange: (e) => { setValue(path, e.target.value); if (swatch) swatch.style.background = `var(--fill-${e.target.value})`; } },
              field.options.map(([v, label]) => h("option", { value: v, selected: v === value }, label)));
            return swatch ? h("div", { class: "select-row" }, swatch, select) : select;
          }
          case "checkbox": {
            const on = field.defaultOn ? value !== false : value === true;
            return h("label", { class: "check" },
              h("input", { type: "checkbox", id, checked: on, onchange: (e) => {
                const checked = e.target.checked;
                setValue(path, field.defaultOn ? (checked ? undefined : false) : (checked ? true : undefined));
              } }),
              field.label);
          }
          case "year":
          case "day":
            return h("input", {
              ...common, type: "text", inputmode: "numeric", value: String(value),
              placeholder: field.type === "year" ? "2026" : "", maxlength: field.type === "year" ? 4 : 2,
              oninput: (e) => {
                const v = e.target.value.trim();
                setValue(path, field.asNumber && /^\d+$/.test(v) ? Number(v) : v);
              },
            });
          case "photo":
            return photoControl(field, path, id);
          case "list":
            return listControl(field, path);
          case "strings":
            return stringsControl(field, path);
          default: {
            const listId = field.suggest ? `${id}-list` : null;
            return [
              h("input", {
                ...common, type: "text", value, autocomplete: "off", list: listId,
                placeholder: field.placeholder ?? (field.type === "url" ? "https://" : null),
                oninput: (e) => { setValue(path, e.target.value); if (field.assist) updateAssist(field); },
              }),
              listId && h("datalist", { id: listId },
                [...new Set(field.suggest(state.data).filter(Boolean))]
                  .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }))
                  .map((v) => h("option", { value: v }))),
            ];
          }
        }
      }

      // A textarea for text that may contain HTML links, with an "Add link"
      // helper and a preview of how it'll read.
      function htmlControl(path, attrs) {
        const ta = h("textarea", { ...attrs, value: get(state.form.draft, path) ?? "", oninput: () => { setValue(path, ta.value); showPreview(); } });
        const preview = h("div", { class: "html-preview" });
        const showPreview = () => {
          preview.hidden = !/[<{]/.test(ta.value);
          fill(preview, ...previewNodes(ta.value));
        };
        let selection = [0, 0];
        const url = h("input", { type: "text", placeholder: "https://… or /about/press", "aria-label": "Link address",
          onkeydown: (e) => { if (e.key === "Enter") { e.preventDefault(); addLink(); } if (e.key === "Escape") { e.stopPropagation(); tool.hidden = true; } } });
        const addLink = () => {
          const href = url.value.trim().replace(/"/g, "%22");
          if (!URL_OK.test(href)) { url.setAttribute("aria-invalid", "true"); url.focus(); return; }
          const [s, e] = selection;
          const text = ta.value.slice(s, e) || href;
          const external = /^https?:/.test(href) ? ' target="_blank" rel="noopener noreferrer"' : "";
          ta.value = ta.value.slice(0, s) + `<a href="${href}"${external}>${text}</a>` + ta.value.slice(e);
          setValue(path, ta.value);
          showPreview();
          tool.hidden = true;
          ta.focus();
        };
        const tool = h("div", { class: "link-tool", hidden: true }, url,
          h("button", { class: "btn btn-small", type: "button", onclick: addLink }, "Add"),
          h("button", { class: "btn btn-small", type: "button", onclick: () => { tool.hidden = true; } }, "Cancel"));
        showPreview();
        return h("div", {}, ta,
          h("div", { class: "html-tools" },
            h("button", { class: "btn btn-small", type: "button", onclick: () => {
              selection = [ta.selectionStart, ta.selectionEnd];
              url.value = "";
              url.removeAttribute("aria-invalid");
              tool.hidden = false;
              url.focus();
            } }, "Add link"),
            tool),
          preview);
      }

      // Renders the user's HTML for the preview, keeping only simple text
      // formatting and links, and marking {placeholders}.
      function previewNodes(html) {
        const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
        const walk = (node) => [...node.childNodes].flatMap((n) => {
          if (n.nodeType === Node.TEXT_NODE) {
            return n.textContent.split(/(\{\w+\})/).map((t, i) => (i % 2 ? h("span", { class: "token" }, t) : t));
          }
          if (n.nodeType !== Node.ELEMENT_NODE) return [];
          const tag = n.tagName.toLowerCase();
          const kids = walk(n);
          if (tag === "a") {
            const href = n.getAttribute("href") ?? "";
            const safe = URL_OK.test(href) ? (href.startsWith("/") ? state.data.preview + href : href) : null;
            return [h("a", { href: safe, target: "_blank", rel: "noopener" }, kids)];
          }
          if (["b", "strong", "i", "em", "br", "code"].includes(tag)) return [h(tag, {}, kids)];
          return kids;
        });
        return walk(doc.body.firstChild);
      }

      function photoControl(field, path, id) {
        const f = state.form;
        const value = get(f.draft, path) ?? "";
        const key = path.join(".");
        const fileInput = h("input", { type: "file", accept: "image/*,.heic,.heif", hidden: true, onchange: (e) => upload(e.target.files[0]) });
        const status = h("span", { class: "hint", "aria-live": "polite" });

        async function upload(file) {
          if (!file) return;
          status.textContent = "Resizing and saving…";
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(new Error("Couldn't read that file."));
              reader.readAsDataURL(file);
            });
            const name = get(f.draft, [...path.slice(0, -1), field.nameFrom]) || file.name.replace(/\.[^.]+$/, "");
            const { image } = await api("POST", "/api/photo", {
              folder: field.folder, name, currentImage: get(f.original, path) ?? "", dataUrl,
            });
            setValue(path, image);
            f.bust[key] = Date.now(); // the file may have been replaced under the same name
            renderForm();
          } catch (err) {
            status.textContent = "";
            toast(err.message, { bad: true });
          }
        }

        const src = photoSrc(value, field.folder);
        const bust = f.bust[key] && src.startsWith("/") ? `?v=${f.bust[key]}` : "";
        return h("div", { class: "photo" },
          h("div", { class: "photo-preview" }, src ? h("img", { src: src + bust, alt: "" }) : "No photo yet"),
          h("div", { class: "photo-side" },
            h("div", { class: "photo-actions" },
              h("button", { class: "btn", type: "button", onclick: () => fileInput.click() }, value ? "Replace photo…" : "Choose photo…"),
              value && h("button", { class: "btn", type: "button", onclick: () => { setValue(path, ""); renderForm(); } }, "Remove"),
              status),
            h("input", {
              type: "text", id, value, "aria-label": `${field.label} file`, "aria-invalid": f.errors[key] ? "true" : null,
              placeholder: field.folder === "carousel" ? "photo.webp" : "/folder/photo.webp or https://…",
              onchange: (e) => { setValue(path, e.target.value.trim()); renderForm(); },
            }),
            h("div", { class: "hint" }, "Any size is fine: photos are resized and saved into the site for you."),
          ),
          fileInput,
        );
      }

      // A list of small records (links, quotes, photos...), each with its own fields.
      function listControl(field, path) {
        const items = get(state.form.draft, path);
        const restructure = (fn, focusIndex) => {
          fn(items);
          updateDirtyUI();
          renderForm();
          if (focusIndex != null) document.getElementById(idOf([...path, focusIndex, field.fields[0].key]))?.focus();
        };
        return h("div", { class: "items" },
          items.map((item, i) => h("div", { class: "item" },
            h("div", { class: "item-head" },
              h("span", { class: "item-title" }, field.itemLabel?.(item) || `${field.itemNoun[0].toUpperCase()}${field.itemNoun.slice(1)} ${i + 1}`),
              h("button", { class: "icon-btn", type: "button", title: "Move up", "aria-label": `Move ${field.itemNoun} ${i + 1} up`, disabled: i === 0,
                onclick: () => restructure((a) => a.splice(i - 1, 0, ...a.splice(i, 1))) }, "↑"),
              h("button", { class: "icon-btn", type: "button", title: "Move down", "aria-label": `Move ${field.itemNoun} ${i + 1} down`, disabled: i === items.length - 1,
                onclick: () => restructure((a) => a.splice(i + 1, 0, ...a.splice(i, 1))) }, "↓"),
              h("button", { class: "btn btn-small", type: "button", "aria-label": `Remove ${field.itemNoun} ${i + 1}`,
                onclick: () => restructure((a) => a.splice(i, 1)) }, "Remove")),
            h("div", { class: "grid" }, renderFields(field.fields, [...path, i])),
          )),
          h("div", {}, h("button", { class: "btn btn-small", type: "button",
            onclick: () => restructure((a) => a.push(newItem(field.fields)), items.length) }, `+ Add ${field.itemNoun}`)),
        );
      }

      // A blank list entry, with each dropdown on its first choice.
      const newItem = (fields) =>
        Object.fromEntries(fields.filter((f) => f.type === "select").map((f) => [f.key, f.options[0][0]]));

      // A list of plain strings (paragraphs, bullets, facts).
      function stringsControl(field, path) {
        const items = get(state.form.draft, path);
        const restructure = (fn, focusIndex) => {
          fn(items);
          updateDirtyUI();
          renderForm();
          if (focusIndex != null) document.getElementById(idOf([...path, focusIndex]))?.focus();
        };
        return h("div", { class: "items" },
          items.map((_, i) => {
            const itemPath = [...path, i];
            const id = idOf(itemPath);
            const attrs = { id, "aria-label": `${field.itemNoun} ${i + 1}`, "aria-invalid": state.form.errors[itemPath.join(".")] ? "true" : null };
            return h("div", { class: "string-item" },
              field.itemType === "html" ? htmlControl(itemPath, attrs)
                : h("input", { ...attrs, type: "text", value: items[i], oninput: (e) => setValue(itemPath, e.target.value) }),
              h("div", { class: "string-tools" },
                h("button", { class: "icon-btn", type: "button", title: "Move up", "aria-label": `Move ${field.itemNoun} ${i + 1} up`, disabled: i === 0,
                  onclick: () => restructure((a) => a.splice(i - 1, 0, ...a.splice(i, 1))) }, "↑"),
                h("button", { class: "icon-btn", type: "button", title: "Move down", "aria-label": `Move ${field.itemNoun} ${i + 1} down`, disabled: i === items.length - 1,
                  onclick: () => restructure((a) => a.splice(i + 1, 0, ...a.splice(i, 1))) }, "↓"),
                h("button", { class: "icon-btn", type: "button", title: "Remove", "aria-label": `Remove ${field.itemNoun} ${i + 1}`,
                  onclick: () => restructure((a) => a.splice(i, 1)) }, "×")),
            );
          }),
          h("div", {}, h("button", { class: "btn btn-small", type: "button",
            onclick: () => restructure((a) => a.push(""), items.length) }, `+ Add ${field.itemNoun}`)),
        );
      }

      // Repeat collaborators are bolded on the site, but only when the name
      // matches exactly, so point out near-misses in spelling or capitals.
      function updateAssist(field) {
        const f = state.form;
        const el = document.getElementById(`${idOf([field.key])}-assist`);
        if (!el) return;
        const name = String(f.draft.collaborator ?? "").trim();
        const others = state.data.collaborations.data.filter((r, i) => i !== f.index);
        const exact = others.filter((r) => r.collaborator === name).length;
        const near = others.find((r) => r.collaborator !== name && r.collaborator.toLowerCase() === name.toLowerCase());
        if (!name) return fill(el, );
        if (exact) return fill(el, `Repeat collaborator: ${plural(exact, "other entry", "other entries")}. Shows in bold on the site.`);
        if (near) {
          return fill(el, 
            `Already in the list as “${near.collaborator}”. `,
            h("button", { type: "button", onclick: () => {
              setValue(["collaborator"], near.collaborator);
              document.getElementById(idOf(["collaborator"])).value = near.collaborator;
              updateAssist(field);
            } }, "Use that spelling"),
          );
        }
        fill(el, "New collaborator.");
      }

      // ---------- Checking & saving ----------

      // Drops list entries left completely blank (e.g. "+ Add" clicked by accident).
      function prune(fields, base, root) {
        for (const field of fields) {
          if (!field.key) continue;
          const path = pathOf(base, field.key);
          const v = get(root, path);
          if (field.type === "strings" && Array.isArray(v)) set(root, path, v.filter((s) => String(s).trim()));
          if (field.type === "list" && Array.isArray(v)) {
            set(root, path, v.filter((item) => Object.values(item).some((x) => !isEmpty(typeof x === "string" ? x.trim() : x) && x !== false)));
          }
        }
      }

      function validate(fields, base, root, errors) {
        for (const field of fields) {
          if (!field.key) continue;
          const path = pathOf(base, field.key);
          const key = path.join(".");
          const raw = get(root, path);
          const v = typeof raw === "string" ? raw.trim() : raw;
          if (field.type === "list") {
            (v ?? []).forEach((_, i) => validate(field.fields, [...path, i], root, errors));
            continue;
          }
          if (field.required && isEmpty(v)) { errors[key] = `${field.label} is required.`; continue; }
          if (isEmpty(v)) continue;
          if (field.type === "url" && !URL_OK.test(v)) errors[key] = URL_ERROR;
          if (field.type === "year" && !/^\d{4}$/.test(String(v))) errors[key] = "Use a 4-digit year, like 2026.";
          if (field.type === "isodate" && !/^\d{4}(-\d{2}(-\d{2})?)?$/.test(v)) errors[key] = "Use YYYY-MM-DD, YYYY-MM or YYYY.";
          if (field.type === "photo" && field.folder !== "carousel" && !URL_OK.test(v)) errors[key] = "Choose a photo, or give a path starting with / or https://.";
          if (field.type === "day") {
            const n = Number(v);
            if (!Number.isInteger(n) || n < 1 || n > 31) errors[key] = "Use a day from 1 to 31.";
            else if (!get(root, [...base, "month"])) errors[key] = "Pick a month too, or leave the day blank.";
          }
        }
        return errors;
      }

      // List entries get their text trimmed and empty optional fields left
      // out, so saved entries look like the hand-written ones; fields keep the
      // order they're listed in above (any others follow, untouched). Page
      // text is saved exactly as typed, apart from dropping blank paragraphs.
      function tidyValue(field, v, trim) {
        if (typeof v === "string") return trim ? v.trim() : v;
        if (field?.type === "strings") return v.filter((s) => s.trim()).map((s) => (trim ? s.trim() : s));
        if (field?.type === "list") return v.map((item) => tidyRecord(field.fields, item, true));
        return v;
      }

      function tidyRecord(fields, record, omitEmpty) {
        const out = {};
        const known = new Set();
        for (const field of fields) {
          if (!field.key) continue;
          known.add(field.key);
          if (!(field.key in record)) continue;
          const v = tidyValue(field, record[field.key], true);
          if (omitEmpty && !field.required && isEmpty(v)) continue;
          out[field.key] = v;
        }
        for (const [k, v] of Object.entries(record)) if (!known.has(k)) out[k] = v;
        return out;
      }

      function tidyPage(fields, record) {
        const out = structuredClone(record);
        for (const field of fields) {
          if (!field.key) continue;
          const path = pathOf([], field.key);
          const v = get(out, path);
          if (v !== undefined) set(out, path, tidyValue(field, v, false));
        }
        return out;
      }

      async function submit() {
        const f = state.form;
        const sec = SECTIONS[state.tab];
        const fields = formFields();
        prune(fields, [], f.draft);
        f.errors = validate(fields, [], f.draft, {});
        if (Object.keys(f.errors).length) {
          renderForm();
          toast("Some fields need a look before saving.", { bad: true });
          $('.form [aria-invalid="true"]')?.focus();
          return;
        }

        if (f.index === "page") {
          if (await saveData(sec.pageText.data, tidyPage(fields, f.draft), "Saved the page text.")) {
            state.form = null;
            render();
          }
          return;
        }
        if (sec.kind === "page") {
          if (await saveData(state.tab, tidyPage(sec.fields, f.draft), `Saved ${sec.label}.`)) {
            state.form = null;
            render();
          }
          return;
        }
        const record = tidyRecord(sec.fields, f.draft, !sec.csv);
        const items = [...state.data[state.tab].data];
        if (f.index < 0) items.unshift(record);
        else items[f.index] = record;
        const name = sec.list.title(record);
        if (await saveData(state.tab, items, f.index < 0 ? `Added “${name}”.` : `Saved “${name}”.`)) {
          state.form = null;
          render();
        }
      }

      async function deleteEntry() {
        const sec = SECTIONS[state.tab];
        const items = [...state.data[state.tab].data];
        const [gone] = items.splice(state.form.index, 1);
        if (await saveData(state.tab, items, `Deleted “${sec.list.title(gone)}”.`)) {
          state.form = null;
          render();
        }
      }

      // ---------- Publishing ----------

      const dialog = $("#publish-dialog");
      const VERBS = { add: "New", update: "Changed", remove: "Removed", reorder: "Reordered", tidy: "Tidied" };
      let busy = false;
      let deployRun = 0;

      async function refreshPublish() {
        try {
          state.publish = await api("GET", "/api/publish");
        } catch (err) {
          state.publish = { problem: err.message, changes: [], pending: [] };
        }
        const p = state.publish;
        const n = p.changes.length + p.pending.length;
        const btn = $("#publish-btn");
        btn.disabled = !n && !p.problem;
        fill(btn, n || p.problem ? "Publish" : "Published ✓", n > 0 && h("span", { class: "badge" }, n));
        btn.title = p.problem ?? (n ? `${plural(n, "change")} not live yet` : "Everything is live on widetim.com");
      }

      function showDialog(...children) {
        fill(dialog, h("h2", { id: "publish-title" }, "Publish to widetim.com"), children);
        if (!dialog.open) dialog.showModal();
      }
      const closeButton = (label = "Close") => h("button", { class: "btn", type: "button", onclick: () => dialog.close() }, label);

      function openPublish() {
        if (blockedByOpenForm()) return;
        const p = state.publish;
        if (p.problem) {
          return showDialog(h("p", { class: "dialog-status bad" }, p.problem), h("div", { class: "dialog-actions" }, closeButton()));
        }
        const byTitle = new Map();
        for (const c of p.changes) {
          if (!byTitle.has(c.title)) byTitle.set(c.title, []);
          byTitle.get(c.title).push(c);
        }
        showDialog(
          p.changes.length > 0 && h("p", {}, "These changes will go live:"),
          h("ul", { class: "changes" }, [...byTitle].map(([title, list]) => h("li", {},
            h("h3", {}, title),
            h("ul", {}, list.map((c) => h("li", {}, h("span", { class: "verb" }, `${VERBS[c.action]}: `), c.label)))))),
          p.pending.length > 0 && h("div", {},
            h("p", {}, p.changes.length ? "Also going out, saved earlier but not on GitHub yet:" : "Saved earlier but not on GitHub yet:"),
            h("ul", {}, p.pending.map((s) => h("li", {}, s)))),
          h("p", { class: "muted" }, "Publishing saves a snapshot to GitHub, and widetim.com rebuilds itself in a minute or two."),
          h("div", { class: "dialog-actions" },
            h("button", { class: "btn btn-primary", type: "button", "data-accent": "coral", onclick: publish }, "Publish now"),
            closeButton("Not yet")),
        );
      }

      async function publish() {
        busy = true;
        showDialog(h("p", { class: "dialog-status" }, "Publishing…"));
        try {
          const { sha } = await api("POST", "/api/publish");
          busy = false;
          watchDeploy(sha);
        } catch (err) {
          busy = false;
          showDialog(h("p", { class: "dialog-status bad" }, err.message), h("div", { class: "dialog-actions" }, closeButton()));
        }
        refreshPublish();
      }

      // Follows the GitHub deploy for a pushed commit until it's live (or the dialog closes).
      async function watchDeploy(sha) {
        const run = ++deployRun;
        const live = "https://widetim.com" + SECTIONS[state.tab].page;
        for (let i = 0; i < 60 && run === deployRun && dialog.open; i++) {
          let s;
          try { s = await api("GET", `/api/deploy?sha=${sha}`); } catch { s = { available: false }; }
          if (run !== deployRun || !dialog.open) return;
          if (!s.available) {
            return showDialog(h("p", { class: "dialog-status" }, "Sent to GitHub! widetim.com will update in a minute or two."),
              h("div", { class: "dialog-actions" }, closeButton()));
          }
          if (s.status === "completed") {
            return s.conclusion === "success"
              ? showDialog(h("p", { class: "dialog-status" }, "Live on widetim.com ✓"),
                  h("p", {}, h("a", { href: live, target: "_blank", rel: "noopener" }, "Open widetim.com ↗"),
                    h("span", { class: "muted" }, " (refresh if you still see the old version)")),
                  h("div", { class: "dialog-actions" }, closeButton()))
              : showDialog(h("p", { class: "dialog-status bad" }, "The site didn't finish rebuilding, so the live site hasn't changed."),
                  h("p", {}, h("a", { href: s.url, target: "_blank", rel: "noopener" }, "See what happened on GitHub ↗"), " or ask Claude to take a look."),
                  h("div", { class: "dialog-actions" }, closeButton()));
          }
          showDialog(h("p", { class: "dialog-status" }, "Sent to GitHub. Rebuilding widetim.com…"),
            h("p", { class: "muted" }, "This usually takes about a minute. You can close this; it keeps going."),
            h("div", { class: "dialog-actions" }, closeButton()));
          await new Promise((r) => setTimeout(r, 6000));
        }
      }

      $("#publish-btn").addEventListener("click", openPublish);
      dialog.addEventListener("cancel", (e) => { if (busy) e.preventDefault(); });
      dialog.addEventListener("close", () => { deployRun++; });
      window.addEventListener("focus", refreshPublish);
      window.addEventListener("beforeunload", (e) => { if (isDirty()) e.preventDefault(); });

      // ---------- Start ----------

      try {
        await loadData();
        render();
        refreshPublish();
      } catch (err) {
        fill(panel, h("p", { class: "error" }, err.message));
      }
    </script>
  </body>
</html>
